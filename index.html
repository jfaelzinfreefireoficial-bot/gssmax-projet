<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GSSMAX IA</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Gen AI SDK Oficial -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    
    <style>
        :root {
            --bg-sidebar: #f9f9f9;
            --bg-main: #ffffff;
            --bg-input: #ffffff;
            --bg-ai-message: #f7f7f8;
            --text-main: #2d3748;
            --text-secondary: #718096;
            --border-color: #cbd5e0;
            --border-focus: #10a37f;
            --accent-color: #10a37f;
            --hover-color: #ececec;
            --shadow-input: 0 -2px 12px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            display: flex;
            position: relative;
        }

        /* --- TELA DE CARREGAMENTO (SPLASH SCREEN) --- */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .splash-logo {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
        }

        .splash-logo span {
            color: var(--accent-color);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #edf2f7;
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .splash-watermark {
            position: absolute;
            bottom: 25px;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* --- OVERLAY PARA MOBILE --- */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 90;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* --- SIDEBAR --- */
        aside {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            height: 100%;
            position: relative;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        @media (max-width: 768px) {
            aside {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
            }
            aside.open {
                transform: translateX(0);
            }
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .new-chat-btn:hover {
            background-color: var(--hover-color);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--hover-color);
        }

        .history-content {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex: 1;
        }

        .history-content span {
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
            transition: color 0.2s, background 0.2s;
            opacity: 0.6;
        }

        .history-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #e53e3e;
            background-color: rgba(229, 62, 62, 0.1);
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid var(--border-color);
        }

        .avatar {
            width: 30px;
            height: 30px;
            background: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            color: white;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .user-email {
            font-size: 10px;
            color: var(--text-secondary);
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .google-login-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
        }

        .google-login-btn:hover {
            background-color: var(--hover-color);
        }

        .google-login-btn i {
            color: #ea4335;
        }

        /* --- MAIN CHAT AREA --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-main);
            height: 50px;
            flex-shrink: 0;
        }

        .menu-toggle {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
        }

        .menu-toggle:hover {
            background-color: var(--hover-color);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 10px 0;
        }

        .welcome-screen {
            margin: auto;
            text-align: center;
            padding: 20px;
        }

        .welcome-screen h1 {
            font-size: 1.3rem;
            color: #1a202c;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .message-row {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            position: relative;
        }

        .message-row.user {
            background-color: var(--bg-main);
        }

        .message-row.ai {
            background-color: var(--bg-ai-message);
        }

        .message-content {
            max-width: 768px;
            width: 100%;
            display: flex;
            gap: 12px;
            line-height: 1.6;
            position: relative;
            align-items: flex-start;
        }

        .message-content .avatar-msg {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 11px;
            color: white;
            overflow: hidden;
        }

        .user .avatar-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user .avatar-msg {
            background-color: #3182ce;
            border-radius: 50%;
        }

        .ai .avatar-msg {
            background-color: var(--accent-color);
            border-radius: 4px;
        }

        .text-body {
            flex: 1;
            overflow-x: auto;
            white-space: pre-wrap;
            color: #2d3748;
            font-size: 14px;
        }

        .msg-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-row.ai:hover .msg-actions {
            opacity: 1;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--hover-color);
            color: var(--text-main);
        }

        .action-btn.playing {
            color: var(--accent-color);
        }

        .analyzing-text {
            color: var(--text-secondary);
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .analyzing-text::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }

        .typing-cursor::after {
            content: '▋';
            display: inline-block;
            animation: blink 1s infinite;
            color: var(--accent-color);
            margin-left: 2px;
            font-size: 13px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .input-area {
            flex-shrink: 0;
            width: 100%;
            background-color: var(--bg-main);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-wrapper {
            max-width: 768px;
            width: 100%;
            background-color: var(--bg-input);
            border-radius: 14px;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            padding: 10px 14px;
            box-shadow: var(--shadow-input);
            transition: border-color 0.2s ease;
            position: relative;
        }

        .input-wrapper:focus-within {
            border-color: var(--border-focus);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            resize: none;
            max-height: 110px;
            outline: none;
            font-size: 14px;
            line-height: 1.4;
            padding-top: 2px;
        }

        textarea::placeholder {
            color: #a0aec0;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .mic-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: color 0.2s, background 0.2s;
        }

        .mic-btn:hover {
            color: var(--accent-color);
            background-color: var(--hover-color);
        }

        .mic-btn.recording {
            color: #e53e3e;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .send-btn {
            background: #cbd5e0;
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
        }

        .input-wrapper.active .send-btn {
            background: var(--accent-color);
        }

        .input-footer-info {
            max-width: 768px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding: 0 4px;
        }
    </style>
</head>
<body>

    <textarea id="globalClipboardInput" style="position: fixed; top: -9999px; left: -9999px; opacity: 0;"></textarea>

    <!-- TELA DE CARREGAMENTO (SPLASH SCREEN) -->
    <div id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">GSSMAX <span>IA</span></div>
            <div class="spinner"></div>
        </div>
        <div class="splash-watermark">Desenvolvido por GSSMAX</div>
    </div>

    <!-- OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- BARRA LATERAL -->
    <aside id="sidebar">
        <div>
            <button class="new-chat-btn" onclick="novoChat()">
                <i class="fa-solid fa-plus"></i> Novo Chat
            </button>
            <div class="history-list" id="historyList"></div>
        </div>
        <div class="sidebar-footer" id="sidebarFooter"></div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main>
        <header>
            <button class="menu-toggle" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span style="font-weight: 600; font-size: 13px; color: #4a5568;">GSSMAX IA Professional</span>
            <div style="width: 20px;"></div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1>Como posso ajudar você hoje?</h1>
            </div>
        </div>

        <!-- CAIXA DE DIGITAÇÃO -->
        <div class="input-area">
            <div class="input-wrapper" id="inputWrapper">
                <textarea id="userInput" rows="1" placeholder="Envie uma mensagem ou use o microfone..." oninput="tratarInput(this)"></textarea>
                <div class="input-actions">
                    <button class="mic-btn" id="micBtn" onclick="alternarGravacaoVoz()" title="Falar por voz">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button class="send-btn" id="sendBtn" onclick="enviarMensagem()">
                        <i class="fa-solid fa-arrow-up" style="font-size: 13px;"></i>
                    </button>
                </div>
            </div>
            <div class="input-footer-info">
                <span>GSSMAX IA - Real SDK Gemini</span>
                <span id="charCounter">0 caracteres</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        // SUA API KEY CONFIGURADA
        const GEMINI_API_KEY = "AQ.Ab8RN6KZQd7nDFm11et2mcRtZQNmviDzU4rdB6fCVqGw-M9iCQ";
        const ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });

        // Fecha o splash screen após 15 segundos
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }
        }, 15000);

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        window.tratarInput = function(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            
            const qtd = textarea.value.length;
            document.getElementById('charCounter').textContent = `${qtd} caractere${qtd === 1 ? '' : 's'}`;

            if(qtd > 0) {
                document.getElementById('inputWrapper').classList.add('active');
            } else {
                document.getElementById('inputWrapper').classList.remove('active');
            }
        }

        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem();
            }
        });

        // --- CHAMADA DA API REAL DO GEMINI USANDO O SDK OFICIAL ---
        async function chamarApiRealGemini(pergunta) {
            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-1.5-flash',
                    contents: pergunta,
                });
                return response.text;
            } catch (error) {
                console.error("Erro ao conectar com a IA:", error);
                return "Desculpe, ocorreu um erro ao conectar com o servidor da IA. Verifique sua chave de API ou restrições de domínio.";
            }
        }

        // --- SISTEMA DE FALA (TEXT-TO-SPEECH) ---
        window.lerTextoEmVozAlta = function(texto, btnElement) {
            if (!('speechSynthesis' in window)) {
                alert("O seu navegador não suporta leitura de voz.");
                return;
            }

            window.speechSynthesis.cancel();
            document.querySelectorAll('.action-btn.playing').forEach(el => el.classList.remove('playing'));

            if (btnElement && btnElement.classList.contains('playing')) {
                btnElement.classList.remove('playing');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            const vozes = window.speechSynthesis.getVoices();
            const vozPtBr = vozes.find(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
            if (vozPtBr) {
                utterance.voice = vozPtBr;
            }

            utterance.onstart = () => { if (btnElement) btnElement.classList.add('playing'); };
            utterance.onend = () => { if (btnElement) btnElement.classList.remove('playing'); };
            utterance.onerror = () => { if (btnElement) btnElement.classList.remove('playing'); };

            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        // --- SISTEMA DE CÓPIA GLOBAL ---
        window.copiarTexto = function(texto, btnElement) {
            const clipboardInput = document.getElementById('globalClipboardInput');
            clipboardInput.value = texto;
            clipboardInput.focus();
            clipboardInput.select();

            try {
                const sucesso = document.execCommand('copy');
                if (sucesso) {
                    marcarSucessoCopia(btnElement);
                } else {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(texto).then(() => marcarSucessoCopia(btnElement));
                    }
                }
            } catch (err) {
                alert("Erro ao copiar para a área de transferência.");
            }
        }

        function marcarSucessoCopia(btnElement) {
            const iconeOriginal = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fa-solid fa-check"></i>';
            setTimeout(() => { btnElement.innerHTML = iconeOriginal; }, 2000);
        }

        // --- INDICADOR DE VOZ (SPEECH TO TEXT) ---
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                const userInputEl = document.getElementById('userInput');
                userInputEl.value += (userInputEl.value ? ' ' : '') + speechToText;
                tratarInput(userInputEl);
                document.getElementById('micBtn').classList.remove('recording');
            };
            recognition.onerror = () => document.getElementById('micBtn').classList.remove('recording');
            recognition.onend = () => document.getElementById('micBtn').classList.remove('recording');
        }

        window.alternarGravacaoVoz = function() {
            const micBtn = document.getElementById('micBtn');
            if (!recognition) {
                alert("O seu navegador não suporta reconhecimento de voz.");
                return;
            }
            if (micBtn.classList.contains('recording')) {
                recognition.stop();
                micBtn.classList.remove('recording');
            } else {
                recognition.start();
                micBtn.classList.add('recording');
            }
        }

        let conversas = JSON.parse(localStorage.getItem('gssmax_tarefas')) || [];
        let chatAtualId = null;
        let usuarioLogado = JSON.parse(localStorage.getItem('gssmax_usuario')) || null;

        renderizarHistorico();
        atualizarRodapéUsuario();

        window.novoChat = function() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            chatAtualId = null;
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <h1>Como posso ajudar você hoje?</h1>
                </div>
            `;
            destativarSelecaoHistorico();
            if (window.innerWidth <= 768) toggleSidebar();
        }

        window.enviarMensagem = async function() {
            const userInputEl = document.getElementById('userInput');
            const texto = userInputEl.value.trim();
            if (!texto) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            if (!chatAtualId) {
                chatAtualId = 'chat_' + Date.now();
                const palavras = texto.trim().split(/\s+/);
                let tituloResumido = palavras.slice(0, 3).join(' ');
                if (palavras.length > 3) tituloResumido += '...';

                conversas.unshift({
                    id: chatAtualId,
                    titulo: tituloResumido,
                    mensagens: []
                });
            }

            const chatObj = conversas.find(c => c.id === chatAtualId);
            chatObj.mensagens.push({ remetente: 'user', texto: texto });
            salvarStorage();

            const fotoUser = usuarioLogado ? usuarioLogado.picture : null;
            adicionarMensagemNaTela(texto, 'user', fotoUser);
            
            userInputEl.value = '';
            userInputEl.style.height = 'auto';
            document.getElementById('inputWrapper').classList.remove('active');
            document.getElementById('charCounter').textContent = '0 caracteres';

            const idAnalisando = adicionarMensagemAnalisando();

            setTimeout(async () => {
                const respostaReal = await chamarApiRealGemini(texto);
                
                removerMensagemAnalisando(idAnalisando);

                chatObj.mensagens.push({ remetente: 'ai', texto: respostaReal });
                salvarStorage();

                adicionarMensagemComDigitacao(respostaReal, 'ai');
                renderizarHistorico();
            }, 5000);
        }

        window.carregarConversa = function(id) {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            chatAtualId = id;
            const chatObj = conversas.find(c => c.id === chatAtualId);
            
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';
            if (chatObj && chatObj.mensagens.length > 0) {
                chatObj.mensagens.forEach(msg => {
                    const foto = (msg.remetente === 'user' && usuarioLogado) ? usuarioLogado.picture : null;
                    adicionarMensagemNaTela(msg.texto, msg.remetente, foto);
                });
            } else {
                chatContainer.innerHTML = `
                    <div class="welcome-screen" id="welcomeScreen">
                        <h1>Como posso ajudar você hoje?</h1>
                    </div>
                `;
            }

            renderizarHistorico();
            if (window.innerWidth <= 768) toggleSidebar();
        }

        window.deletarConversa = function(event, id) {
            event.stopPropagation();
            conversas = conversas.filter(c => c.id !== id);
            salvarStorage();
            if (chatAtualId === id) novoChat();
        }

        function renderizarHistorico() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            conversas.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === chatAtualId ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="history-content" onclick="carregarConversa('${chat.id}')">
                        <i class="fa-regular fa-message" style="font-size: 12px; color: #a0aec0;"></i>
                        <span>${escapeHtml(chat.titulo)}</span>
                    </div>
                    <button class="delete-btn" onclick="deletarConversa(event, '${chat.id}')" title="Excluir tarefa">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                `;
                historyList.appendChild(item);
            });
        }

        function destativarSelecaoHistorico() {
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
        }

        function salvarStorage() {
            localStorage.setItem('gssmax_tarefas', JSON.stringify(conversas));
            renderizarHistorico();
        }

        function adicionarMensagemNaTela(texto, remetente, fotoPerfil = null) {
            const chatContainer = document.getElementById('chatContainer');
            const row = document.createElement('div');
            row.className = `message-row ${remetente}`;
            
            let avatarIcon = remetente === 'user' ? (fotoPerfil ? `<img src="${fotoPerfil}" alt="User">` : `<i class="fa-solid fa-user"></i>`) : `<i class="fa-solid fa-robot"></i>`;

            let acoesHtml = remetente === 'ai' ? `
                <div class="msg-actions">
                    <button class="action-btn" onclick="copiarTexto(\`${texto.replace(/`/, '\\`')}\`, this)" title="Copiar texto"><i class="fa-regular fa-copy"></i></button>
                    <button class="action-btn" onclick="lerTextoEmVozAlta(\`${texto.replace(/`/, '\\`')}\`, this)" title="Ouvir resposta"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            ` : '';

            row.innerHTML = `
                <div class="message-content">
                    <div class="avatar-msg">${avatarIcon}</div>
                    <div class="text-body">${escapeHtml(texto)}</div>
                    ${acoesHtml}
                </div>
            `;
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function adicionarMensagemAnalisando() {
            const chatContainer = document.getElementById('chatContainer');
            const rowId = 'analisando_' + Date.now();
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.id = rowId;

            row.innerHTML = `
                <div class="message-content">
                    <div class="avatar-msg"><i class="fa-solid fa-robot"></i></div>
                    <div class="text-body analyzing-text">GSSMAX IA está analisando sua resposta</div>
                </div>
            `;
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return rowId;
        }

        function removerMensagemAnalisando(rowId) {
            const row = document.getElementById(rowId);
            if (row) row.remove();
        }

        function adicionarMensagemComDigitacao(textoCompleto, remetente) {
            const chatContainer = document.getElementById('chatContainer');
            const row = document.createElement('div');
            row.className = `message-row ${remetente}`;
            const avatarIcon = '<i class="fa-solid fa-robot"></i>';

            row.innerHTML = `
                <div class="message-content">
                    <div class="avatar-msg">${avatarIcon}</div>
                    <div class="text-body typing-cursor" id="currentTyping"></div>
                    <div class="msg-actions" id="tempActions" style="display:none;">
                        <button class="action-btn" onclick="copiarTexto(\`${textoCompleto.replace(/`/, '\\`')}\`, this)" title="Copiar texto"><i class="fa-regular fa-copy"></i></button>
                        <button class="action-btn" onclick="lerTextoEmVozAlta(\`${textoCompleto.replace(/`/, '\\`')}\`, this)" title="Ouvir resposta"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                </div>
            `;
            chatContainer.appendChild(row);
            
            const targetElement = document.getElementById('currentTyping');
            const tempActions = document.getElementById('tempActions');
            targetElement.removeAttribute('id');
            tempActions.removeAttribute('id');

            let i = 0;
            const velocidade = 12;

            function digitar() {
                if (i < textoCompleto.length) {
                    targetElement.textContent += textoCompleto.charAt(i);
                    i++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    setTimeout(digitar, velocidade);
                } else {
                    targetElement.classList.remove('typing-cursor');
                    const actions = row.querySelector('.msg-actions');
                    if (actions) actions.style.display = 'flex';
                }
            }
            digitar();
        }

        function atualizarRodapéUsuario() {
            const sidebarFooter = document.getElementById('sidebarFooter');
            if (usuarioLogado) {
                sidebarFooter.innerHTML = `
                    <div class="user-profile">
                        <div class="avatar"><img src="${usuarioLogado.picture}" alt="Avatar"></div>
                        <div class="user-info">
                            <span class="user-name">${escapeHtml(usuarioLogado.name)}</span>
                            <span class="user-email">${escapeHtml(usuarioLogado.email)}</span>
                        </div>
                    </div>
                    <button class="google-login-btn" onclick="fazerLogout()" style="color: #e53e3e;">
                        <i class="fa-solid fa-right-from-bracket" style="color: #e53e3e;"></i> Sair da conta
                    </button>
                `;
            } else {
                sidebarFooter.innerHTML = `
                    <button class="google-login-btn" onclick="iniciarLoginGoogle()">
                        <i class="fa-brands fa-google"></i> Entrar com Google
                    </button>
                `;
            }
        }

        window.iniciarLoginGoogle = function() {
            google.accounts.id.initialize({
                client_id: "SEU_CLIENT_ID_DO_GOOGLE.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.prompt();
        }

        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            usuarioLogado = {
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };
            localStorage.setItem('gssmax_usuario', JSON.stringify(usuarioLogado));
            atualizarRodapéUsuario();
            location.reload();
        }

        function parseJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('-00' + c.charCodeAt(0).toString(16)).slice(-4)).join(''));
            return JSON.parse(jsonPayload);
        }

        window.fazerLogout = function() {
            localStorage.removeItem('gssmax_usuario');
            usuarioLogado = null;
            atualizarRodapéUsuario();
            location.reload();
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
